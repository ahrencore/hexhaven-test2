<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Hexhaven — Terrain Geometry Study</title><style>*{box-sizing:border-box}body{margin:0;background:#101019;color:#e7e4f5;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:absolute;top:0;left:0;right:0;z-index:2;padding:18px 22px;pointer-events:none}h1{font-size:18px;margin:0 0 4px;font-weight:650;letter-spacing:.04em}p{font-size:12px;color:#bcb6d2;margin:0;line-height:1.5}.foot{position:absolute;bottom:16px;left:16px;right:16px;text-align:center;font-size:12px;color:#bbb4d2;pointer-events:none}.tag{position:absolute;top:17px;right:18px;color:#c3c0d2;font-size:11px;border:1px solid #454052;border-radius:20px;padding:5px 9px}</style></head><body><header><h1>Hexhaven · Terrain Geometry Study</h1><p>3 connected water hexes · 2 adjoining land hexes<br>Enchanted twilight · no rocks · no houses · no trees</p></header><div class="tag">ART TEST · NOT GAMEPLAY</div><div class="foot">Drag to orbit · Scroll or pinch to zoom · The lake is one uninterrupted surface</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101019');
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(9,12,15);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbed8ff,0x20202c,2.1));const sun=new THREE.DirectionalLight(0xffd6af,2.6);sun.position.set(-4,9,6);scene.add(sun);const rim=new THREE.DirectionalLight(0x6688ff,1.0);rim.position.set(5,4,-5);scene.add(rim);
// Pointy-top axial coordinates. Three water cells meet in a continuous lake.
const radius=1.65, SQ=Math.sqrt(3), height=.22;
const tiles=[{q:0,r:0,t:'water'},{q:1,r:0,t:'water'},{q:0,r:1,t:'water'},{q:-1,r:0,t:'land'},{q:1,r:-1,t:'land'}];
const key=(q,r)=>`${q},${r}`;const map=new Map(tiles.map(t=>[key(t.q,t.r),t]));
const pos=(q,r)=>new THREE.Vector3(radius*SQ*(q+r/2),0,radius*1.5*r);
const angle=i=>Math.PI/180*(60*i-30);
const corner=(i,c)=>new THREE.Vector3(c.x+radius*Math.cos(angle(i)),0,c.z+radius*Math.sin(angle(i)));
const shoreMat=new THREE.MeshStandardMaterial({color:0x53745b,roughness:.95,flatShading:true});const landMat=new THREE.MeshStandardMaterial({color:0x77a678,roughness:1,flatShading:true});const landEdgeMat=new THREE.MeshStandardMaterial({color:0x344a45,roughness:1,flatShading:true});const waterEdgeMat=new THREE.MeshStandardMaterial({color:0x185f81,roughness:.7,metalness:.04});
function meshFromTriangles(vertices,mat){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.computeVertexNormals();const m=new THREE.Mesh(g,mat);scene.add(m);return m;}
function triangle(a,b,c,y,arr){arr.push(a.x,y,a.z,b.x,y,b.z,c.x,y,c.z)}
// Each hex has a very thin outer vertical edge. No raised islands or individual river paths.
for(const t of tiles){const c=pos(t.q,t.r),v=[];for(let i=0;i<6;i++){const a=corner(i,c),b=corner((i+1)%6,c);const yTop=t.t==='water'?.035:.09;v.push(a.x,yTop,a.z,b.x,yTop,b.z,a.x,-height,a.z,b.x,yTop,b.z,b.x,-height,b.z,a.x,-height,a.z)}meshFromTriangles(v,t.t==='water'?waterEdgeMat:landEdgeMat)}
// Flat water tops share exactly the same height and color; there are no seams or water rocks.
const waterMat=new THREE.MeshStandardMaterial({color:0x20b7d1,roughness:.24,metalness:.12,side:THREE.DoubleSide});
const waterTriangles=[],landTriangles=[];for(const t of tiles){const c=pos(t.q,t.r);for(let i=0;i<6;i++){const a=corner(i,c),b=corner((i+1)%6,c);triangle(c,a,b,t.t==='water'?.035:.09,t.t==='water'?waterTriangles:landTriangles)}}meshFromTriangles(waterTriangles,waterMat);meshFromTriangles(landTriangles,landMat);
// Shoreline trim exists ONLY where land touches water. Nothing cuts across water-water boundaries.
const dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
// Geometry orientation is based on each actual hex edge; find adjacent cell by midpoint proximity.
const landTiles=tiles.filter(t=>t.t==='land');const waterTiles=tiles.filter(t=>t.t==='water');
function neighborForEdge(t,i){const c=pos(t.q,t.r),a=corner(i,c),b=corner((i+1)%6,c),m=a.clone().add(b).multiplyScalar(.5);let best=null,dist=Infinity;for(const o of tiles){if(o===t)continue;const d=pos(o.q,o.r).distanceTo(m);if(d<dist){dist=d;best=o}}return dist<radius*1.15?best:null}
const shoreV=[];for(const t of landTiles){const c=pos(t.q,t.r);for(let i=0;i<6;i++){const nb=neighborForEdge(t,i);if(!nb||nb.t!=='water')continue;const a=corner(i,c),b=corner((i+1)%6,c);const mid=a.clone().add(b).multiplyScalar(.5),toward=c.clone().sub(mid).normalize().multiplyScalar(.13);const ai=a.clone().add(toward),bi=b.clone().add(toward);const y=.102;triangle(a,b,ai,y,shoreV);triangle(b,bi,ai,y,shoreV)}}if(shoreV.length)meshFromTriangles(shoreV,shoreMat);
// Sparse grass on land only, deliberately avoiding shoreline and clutter.
const grassMat=new THREE.MeshStandardMaterial({color:0x9acb88,roughness:1});for(const t of landTiles){const c=pos(t.q,t.r);for(let i=0;i<14;i++){const phi=i*2.39996,rr=.18+.84*Math.sqrt((i+.5)/14);const x=c.x+Math.cos(phi)*rr,z=c.z+Math.sin(phi)*rr;const geo=new THREE.ConeGeometry(.035,.14,4);const g=new THREE.Mesh(geo,grassMat);g.position.set(x,.17,z);g.rotation.y=i*.8;scene.add(g)}}
// One faint continuous lake sheen: non-geometric, not separate rivers.
const sheenMat=new THREE.MeshBasicMaterial({color:0xb8f9ff,transparent:true,opacity:.12,depthWrite:false,side:THREE.DoubleSide});
let sheen=[];for(const t of waterTiles){const c=pos(t.q,t.r);const a=new THREE.Vector3(c.x-.45,0,c.z-.20),b=new THREE.Vector3(c.x+.45,0,c.z-.20),d=new THREE.Vector3(c.x-.45,0,c.z-.16),e=new THREE.Vector3(c.x+.45,0,c.z-.16);triangle(a,b,d,.041,sheen);triangle(b,e,d,.041,sheen)}meshFromTriangles(sheen,sheenMat);
const target=new THREE.Vector3(0,0,0),pointer={active:false,x:0,y:0};let az=.65,el=.83,dist=18;function updateCamera(){camera.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(az)*Math.cos(el));camera.lookAt(target)}updateCamera();
renderer.domElement.addEventListener('pointerdown',e=>{pointer.active=true;pointer.x=e.clientX;pointer.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!pointer.active)return;az-=(e.clientX-pointer.x)*.008;el=Math.max(.28,Math.min(1.35,el+(e.clientY-pointer.y)*.006));pointer.x=e.clientX;pointer.y=e.clientY;updateCamera()});renderer.domElement.addEventListener('pointerup',()=>pointer.active=false);renderer.domElement.addEventListener('pointercancel',()=>pointer.active=false);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(35,dist+e.deltaY*.012));updateCamera()},{passive:false});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)dist=Math.max(8,Math.min(35,dist*pinch/d));pinch=d;updateCamera()}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
