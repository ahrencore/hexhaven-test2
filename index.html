<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Hexhaven — Terrain Geometry Study</title><style>*{box-sizing:border-box}body{margin:0;background:#101019;color:#e7e4f5;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:absolute;top:0;left:0;right:0;z-index:2;padding:18px 22px;pointer-events:none}h1{font-size:18px;margin:0 0 4px;font-weight:650;letter-spacing:.04em}p{font-size:12px;color:#bcb6d2;margin:0;line-height:1.5}.foot{position:absolute;bottom:16px;left:16px;right:16px;text-align:center;font-size:12px;color:#bbb4d2;pointer-events:none}.tag{position:absolute;top:17px;right:18px;color:#c3c0d2;font-size:11px;border:1px solid #454052;border-radius:20px;padding:5px 9px}</style></head><body><header><h1>Hexhaven · Terrain Geometry Study</h1><p>3 full-water · 2 mixed shoreline · 2 grassy hexes<br>Enchanted twilight · no rocks · no houses · no trees</p></header><div class="tag">ART TEST · NOT GAMEPLAY</div><div class="foot">Drag to orbit · Scroll or pinch to zoom · The lake is one uninterrupted surface</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101019');
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9c8ff,0x46516c,2.5));
const keyLight=new THREE.DirectionalLight(0xe3b8ff,2.1);keyLight.position.set(-5,10,7);scene.add(keyLight);
const rim=new THREE.DirectionalLight(0x65b9ff,1.3);rim.position.set(6,7,-5);scene.add(rim);
const R=1.55,S=Math.sqrt(3),thickness=.18,landY=.13,waterY=.065;
const tiles=[
 {q:0,r:0,type:'water'}, {q:1,r:0,type:'water'}, {q:0,r:1,type:'water'},
 {q:-1,r:0,type:'mixed',waterSide:0}, {q:1,r:-1,type:'mixed',waterSide:2},
 {q:-1,r:1,type:'land'}, {q:2,r:-1,type:'land'}
];
const center=t=>new THREE.Vector3(R*S*(t.q+t.r/2),0,R*1.5*t.r);
const corner=(c,i)=>new THREE.Vector3(c.x+R*Math.cos(Math.PI/180*(60*i-30)),0,c.z+R*Math.sin(Math.PI/180*(60*i-30)));
const landMat=new THREE.MeshStandardMaterial({color:0x79b57a,roughness:1,side:THREE.DoubleSide});
const waterMat=new THREE.MeshStandardMaterial({color:0x16bdd4,roughness:.27,metalness:.08,side:THREE.DoubleSide});
const edgeMat=new THREE.MeshStandardMaterial({color:0x415c53,roughness:1,side:THREE.DoubleSide});
const waterEdgeMat=new THREE.MeshStandardMaterial({color:0x137b91,roughness:.8,side:THREE.DoubleSide});
const bankMat=new THREE.MeshStandardMaterial({color:0x9ac78d,roughness:1,side:THREE.DoubleSide});
function mesh(points,mat){if(!points.length)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(points,3));g.computeVertexNormals();scene.add(new THREE.Mesh(g,mat))}
function tri(arr,a,b,c){arr.push(...a,...b,...c)}
function v(p,y){return [p.x,y,p.z]}
function quad(arr,a,b,c,d){tri(arr,a,b,c);tri(arr,a,c,d)}
const lands=[],waters=[],banks=[],edges=[],waterEdges=[];
for(const t of tiles){
 const c=center(t),cs=Array.from({length:6},(_,i)=>corner(c,i));
 // Side walls are uniformly thin, independent of the surface type.
 for(let i=0;i<6;i++){
   const a=cs[i],b=cs[(i+1)%6],isWater=t.type==='water';
   quad(isWater?waterEdges:edges,v(a,isWater?waterY:landY),v(b,isWater?waterY:landY),v(b,-thickness),v(a,-thickness));
 }
 if(t.type==='water'||t.type==='land'){
   for(let i=0;i<6;i++)tri(t.type==='water'?waters:lands,v(c,t.type==='water'?waterY:landY),v(cs[i],t.type==='water'?waterY:landY),v(cs[(i+1)%6],t.type==='water'?waterY:landY));
 }else{
   // A wide water inlet occupies about half the tile, not a narrow river.
   // Water boundary spans an entire outer hex edge, plus two neighboring partial edges.
   const i=t.waterSide, a=cs[i],b=cs[(i+1)%6];
   const edgeMid=a.clone().add(b).multiplyScalar(.5);
   const shoreCenter=c.clone().lerp(edgeMid,.15);
   const tangent=b.clone().sub(a).normalize();
   const halfWidth=R*.80;
   const p=shoreCenter.clone().addScaledVector(tangent,-halfWidth);
   const q=shoreCenter.clone().addScaledVector(tangent,halfWidth);
   // Water polygon is a broad quadrilateral reaching the selected outer edge.
   quad(waters,v(a,waterY),v(b,waterY),v(q,waterY),v(p,waterY));
   // Remaining terrain fills the hex top, using a polygon triangulation around its boundary.
   // Polygon follows outer corners from b around the land side to a, then p and q.
   const polygon=[q,...Array.from({length:5},(_,j)=>cs[(i+1+j)%6]),a,p];
   for(let j=1;j<polygon.length-1;j++)tri(lands,v(polygon[0],landY),v(polygon[j],landY),v(polygon[j+1],landY));
   // Clean, slim shoreline: not rocks, not a river channel.
   const inset=.10, pp=p.clone().addScaledVector(c.clone().sub(edgeMid).normalize(),inset),qq=q.clone().addScaledVector(c.clone().sub(edgeMid).normalize(),inset);
   quad(banks,v(p,landY+.006),v(q,landY+.006),v(qq,landY+.006),v(pp,landY+.006));
 }
}
mesh(edges,edgeMat);mesh(waterEdges,waterEdgeMat);mesh(lands,landMat);mesh(waters,waterMat);mesh(banks,bankMat);
const target=new THREE.Vector3(.5,0,.15);let az=.65,el=.88,dist=19;const pointer={active:false,x:0,y:0};
function updateCamera(){camera.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(az)*Math.cos(el));camera.lookAt(target)}
updateCamera();
renderer.domElement.addEventListener('pointerdown',e=>{pointer.active=true;pointer.x=e.clientX;pointer.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointer.active)return;az-=(e.clientX-pointer.x)*.008;el=Math.max(.28,Math.min(1.35,el+(e.clientY-pointer.y)*.006));pointer.x=e.clientX;pointer.y=e.clientY;updateCamera()});
for(const ev of ['pointerup','pointercancel'])renderer.domElement.addEventListener(ev,()=>pointer.active=false);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(35,dist+e.deltaY*.012));updateCamera()},{passive:false});
let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(8,Math.min(35,dist*pinch/d));pinch=d;updateCamera()}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
